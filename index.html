
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAKING V6 - BOSS EDITION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;user-select:none}
#game{width:100%;max-width:420px;height:100vh;max-height:800px;background:radial-gradient(circle at center,#1a1a3a 0%,#050510 100%);position:relative;box-shadow:0 0 50px #a855f7}
canvas{width:100%;height:72vh;display:block}
#ui{padding:12px;background:#12122a;border-top:2px solid #a855f7;text-align:center}
#top{display:flex;justify-content:space-between;font-weight:bold;color:#fff;font-size:14px;margin-bottom:8px}
#score{color:#fbbf24} #level{color:#a855f7}
h1{font-size:20px;letter-spacing:2px;color:#fff}
h1 span{color:#a855f7}
#btn{margin-top:10px;width:100%;background:linear-gradient(90deg,#a855f7,#7c3aed);color:#fff;border:0;padding:14px;border-radius:12px;font-size:16px;font-weight:bold}
#controls{display:flex;justify-content:space-between;margin-top:8px;gap:8px}
.ctrl{flex:1;background:#1e1e3a;border:1px solid #333;padding:10px;border-radius:8px;color:#fff;font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="game">
<canvas id="c" width="400" height="620"></canvas>
<div id="ui">
<div id="top"><div id="score">SCORE: 0</div><div id="level">LEVEL: 1</div></div>
<h1>TAKING <span>V6</span></h1>
<div id="btn">🔥 BOSS EDITION 🔥</div>
<div id="controls"><div class="ctrl">◀️ MOVE</div><div class="ctrl">🔥 AUTO FIRE</div></div>
</div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),scoreE=document.getElementById('score'),levelE=document.getElementById('level'),btn=document.getElementById('btn');
let S=0,H=20,W=30,enemies=[],bullets=[],particles=[],score=0,level=1,playing=false,keys={},lastShot=0;
const player={x:185,y:550,w:30,h:30,s:5};
function loop(){
if(!playing)return; x.clearRect(0,0,400,620);
if(keys['a']||keys['ArrowLeft'])player.x-=player.s;
if(keys['d']||keys['ArrowRight'])player.x+=player.s;
if(keys['w'])player.y-=5;
if(keys['s'])player.y+=5;
player.x=Math.max(0,Math.min(370,player.x)); player.y=Math.max(350,Math.min(580,player.y));
x.shadowBlur=20; x.fillStyle='#a855f7'; x.fillRect(player.x,player.y,player.w,player.h); x.shadowBlur=0;
x.fillRect(player.x+10,player.y-12,10,12);
if(Date.now()-lastShot>100){bullets.push({x:player.x+13,y:player.y,h:6,w:4}); lastShot=Date.now();}
for(let i=0;i<bullets.length;i++){let b=bullets[i]; b.y-=12; x.fillStyle='#fbbf24'; x.fillRect(b.x,b.y,b.w,b.h); if(b.y<0)bullets.splice(i,1);}
for(let i=0;i<enemies.length;i++){let e=enemies[i]; e.y+=e.v; e.x+=e.vx; x.shadowBlur=10; x.shadowColor='#ef4444'; x.fillStyle='#ef4444'; x.fillRect(e.x,e.y,e.w,e.h); x.shadowBlur=0; x.fillStyle='#fff'; x.fillRect(e.x+5,e.y+5,5,5);
if(e.y>620||(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y)){enemies.splice(i,1); if(e.y<=620){S-=10; scoreE.innerText='SCORE: '+score; if(S<=0){S=0; endGame();}}}}
for(let i=0;i<bullets.length;i++){for(let j=0;j<enemies.length;j++){let b=bullets[i],e=enemies[j]; if(b&&e&&b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){bullets.splice(i,1); score+=10; S+=5; scoreE.innerText='SCORE: '+score; levelE.innerText='LEVEL: '+level; particles.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:20}); enemies.splice(j,1); break;}}}
for(let i=0;i<particles.length;i++){let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.life--; x.fillStyle='#fbbf24'; x.fillRect(p.x,p.y,3,3); if(p.life<=0)particles.splice(i,1);}
if(Math.random()<0.05)enemies.push({x:Math.random()*350,y:-40,w:30,h:30,v:1.5+level*0.2,vx:(Math.random()-0.5)*2});
requestAnimationFrame(loop);
}
function endGame(){playing=false; btn.innerText='💀 GAME OVER - RESTART'; btn.style.background='#ef4444';}
btn.onclick=()=>{if(!playing){S=20; score=0; enemies=[]; bullets=[]; playing=true; btn.innerText='⚔️ PLAYING...'; btn.style.background='linear-gradient(90deg,#a855f7,#7c3aed)'; level=1; loop();}};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
c.addEventListener('touchmove',e=>{let t=e.touches[0]; let rect=c.getBoundingClientRect(); player.x=(t.clientX-rect.left)*(400/rect.width)-15; player.y=(t.clientY-rect.top)*(620/rect.height)-15;});
</script>
</div>
</body>
</html>
