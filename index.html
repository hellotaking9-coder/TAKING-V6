<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKING-V8 | Followers Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{background:#000;color:#fff;font-family:sans-serif}
.post-card{background:#111;border:1px solid #222;border-radius:16px;padding:16px;margin-bottom:16px}
.btn-primary{background:#a855f7;color:white;padding:10px 20px;border-radius:999px;font-weight:bold}
</style>
</head>
<body class="max-w-[500px] mx-auto p-4">

<!-- HEADER -->
<div class="flex justify-between items-center py-4">
<h1 class="text-2xl font-black text-purple-500">TAKING V8</h1>
<div class="flex gap-4">
<button onclick="showFollowers()" class="bg-zinc-900 px-4 py-2 rounded-full text-sm"><i class="fa-solid fa-users"></i> Followers</button>
<i class="fa-solid fa-bell text-xl"></i>
</div>
</div>

<!-- FOLLOWERS MODAL - NEW FIXED -->
<div id="followersModal" class="hidden fixed inset-0 bg-black/90 z-50 p-4 overflow-y-auto">
<div class="bg-zinc-900 rounded-2xl p-4 max-w-[500px] mx-auto mt-10">
<div class="flex justify-between items-center mb-4">
<h2 class="text-xl font-bold">Followers & Following</h2>
<button onclick="hideFollowers()" class="text-2xl">&times;</button>
</div>
<div id="followersList" class="space-y-3">
<!-- Followers will load here -->
<div class="text-center text-zinc-500 py-10">Loading Followers...</div>
</div>
</div>
</div>

<!-- FEED -->
<div id="feed">
<div class="post-card">
<div class="flex items-center gap-3 mb-3">
<img src="https://i.pravatar.cc/100" class="w-10 h-10 rounded-full">
<div><p class="font-bold">hellotaking9</p><p class="text-xs text-zinc-500">Just now</p></div>
<button class="ml-auto bg-white text-black px-4 py-1 rounded-full text-sm font-bold follow-btn" onclick="toggleFollow(this)">Follow</button>
</div>
<p class="mb-3">Welcome to TAKING V8 - Followers System Fixed! 🚀</p>
<img src="https://picsum.photos/500/500" class="rounded-xl w-full">
<div class="flex gap-6 mt-3 text-xl"><i class="fa-regular fa-heart"></i><i class="fa-regular fa-comment"></i><i class="fa-regular fa-share-from-square"></i></div>
</div>
</div>

<script>
// FOLLOWERS SYSTEM - FIXED
let followers = JSON.parse(localStorage.getItem('taking_followers') || '[]');

function showFollowers(){
document.getElementById('followersModal').classList.remove('hidden');
loadFollowers();
}
function hideFollowers(){
document.getElementById('followersModal').classList.add('hidden');
}
function toggleFollow(btn){
if(btn.innerText === 'Follow'){
btn.innerText = 'Following';
btn.classList.remove('bg-white','text-black');
btn.classList.add('bg-zinc-800','text-white');
followers.push({name:'hellotaking9', time: new Date().toLocaleString()});
}else{
btn.innerText = 'Follow';
btn.classList.add('bg-white','text-black');
btn.classList.remove('bg-zinc-800','text-white');
}
localStorage.setItem('taking_followers', JSON.stringify(followers));
}

function loadFollowers(){
const list = document.getElementById('followersList');
if(followers.length === 0){
list.innerHTML = `<div class="text-center text-zinc-500 py-10"><i class="fa-solid fa-users text-4xl mb-3"></i><p>No followers yet</p><p class="text-sm">Follow someone to see here</p></div>`;
}else{
list.innerHTML = followers.map(f => `
<div class="flex items-center gap-3 bg-black p-3 rounded-xl border border-zinc-800">
<img src="https://i.pravatar.cc/100" class="w-10 h-10 rounded-full">
<div><p class="font-bold">${f.name}</p><p class="text-xs text-zinc-500">${f.time}</p></div>
<button class="ml-auto bg-zinc-800 px-4 py-1 rounded-full text-sm">Following</button>
</div>`).join('');
}
}
</script>
</body>
</html>
