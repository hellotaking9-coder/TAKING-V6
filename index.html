<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAKING V2.9 + V10</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:Arial}.topBar{position:fixed;top:0;left:0;width:100%;height:56px;background:linear-gradient(90deg,#5e17eb,#7c4dff);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:50}.tabBar{position:fixed;top:56px;left:0;width:100%;height:48px;background:#0f0f1a;display:flex;gap:8px;padding:8px 12px;z-index:49;border-bottom:1px solid #1e1e2e}.tabBtn{flex:1;border-radius:20px;border:1px solid #2a2a3a;background:#1a1a2e;color:#888;font-weight:900;font-size:13px}.tabBtn.active{background:linear-gradient(90deg,#5e17eb,#7c4dff);color:#fff}.grid{margin-top:110px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;padding-bottom:80px}.thumb{position:relative;aspect-ratio:3/4;background:#1a1a2e;overflow:hidden}.thumb canvas{width:100%;height:100%}.label{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,0.7);padding:2px 6px;border-radius:10px;font-size:10px}.emptyMsg{grid-column:1/-1;text-align:center;padding:40px;color:#888}#full{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:60;display:none}#mainVideoWrap{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:#000}#fullVideo{width:100%;height:100%;object-fit:contain}.videoOverlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}.videoOverlay *{pointer-events:auto}.videoTop{position:absolute;top:0;left:0;width:100%;padding:12px;display:flex;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,0.6),transparent)}.videoRight{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:14px;align-items:center}.vBtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}.followWrap{position:relative;width:44px;height:44px;cursor:pointer}.followPlus{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:20px;height:20px;background:#ff2d55;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff}.followPlus.following{background:#22c55e}.videoBottom{position:absolute;bottom:0;left:0;width:100%;padding:10px;background:linear-gradient(0deg,rgba(0,0,0,0.8),transparent)}.earnBar{height:3px;background:rgba(255,255,255,0.3);border-radius:2px;margin-bottom:6px;overflow:hidden}.earnProgress{height:100%;background:#5e17eb;width:0%}#completePage{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.96);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.completeCard{background:#1c1c2a;border-radius:24px;padding:24px 20px;width:100%;max-width:340px;text-align:center;border:1px solid #2a2a3a}.btnRow{display:flex;gap:12px}.btnNextNew{flex:1;background:#22c55e;color:#fff;padding:14px;border-radius:14px;border:none;font-weight:900}.btnCloseNew{flex:1;background:#3a3a4a;color:#fff;padding:14px;border-radius:14px;border:none;font-weight:800}.bottomBar{position:fixed;bottom:12px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 12px;z-index:45}.bottomWallet{background:linear-gradient(90deg,#FFD700,#ffb700);color:#000;padding:12px 20px;border-radius:30px;font-weight:900;border:2px solid #fff}.addBtn{background:linear-gradient(90deg,#5e17eb,#7c4dff);color:#fff;padding:12px 28px;border-radius:30px;border:none;font-weight:900}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:20px;display:none;z-index:100}#popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}#popbox{background:#1e1e2e;border-radius:16px;padding:20px;width:100%;max-width:320px}#popbox input{width:100%;background:#2a2a3a;border-radius:10px;padding:12px;color:#fff;margin-top:10px;border:1px solid #3a3a4a}#settingsBg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:70;display:none}#settings{position:fixed;top:0;right:-100%;width:92%;max-width:400px;height:100%;background:#0f0f1a;z-index:80;overflow-y:auto;transition:right 0.3s ease}</style></head><body>
<div class="topBar"><div style="display:flex;align-items:center;gap:8px"><div style="width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center">👤</div><div><div style="font-weight:900">Hussain</div><div style="font-size:10px">V2.9 + V10 MERGED</div></div></div><button onclick="document.getElementById('settings').style.right='0';document.getElementById('settingsBg').style.display='block'" style="width:42px;height:42px;border-radius:50%;background:#22c55e;border:2px solid #fff">☰</button></div>
<div class="tabBar"><button id="tabForYou" class="tabBtn active" onclick="switchTab('foryou')">For You</button><button id="tabFollowing" class="tabBtn" onclick="switchTab('following')">Following (<span id="followCountTab">0</span>)</button></div>
<div class="grid" id="grid"></div>
<div class="bottomBar"><div class="bottomWallet">💰 <span id="wallet">₹0.00</span></div><button class="addBtn" onclick="pickVideo()">+ 📹 Video Add</button></div>
<div id="full"><div id="mainVideoWrap"><video id="fullVideo" playsinline controls></video><div class="videoOverlay"><div class="videoTop"><div id="videoPos" style="background:rgba(0,0,0,0.5);padding:4px 10px;border-radius:15px;font-size:12px">1/0</div><span onclick="closeFull()" style="background:rgba(0,0,0,0.5);padding:6px 12px;border-radius:15px;cursor:pointer">✕</span></div><div class="videoRight"><div class="followWrap" onclick="toggleFollowCur()"><div style="width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px">👤</div><div class="followPlus" id="followPlus">+</div></div><div class="vBtn" onclick="likeCur()">❤️</div><div class="vBtn" onclick="shareAll()">↗️</div></div><div style="position:absolute;bottom:50px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,0,0,0.8);display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="deleteCurVideo()">🗑️</div><div class="videoBottom"><div class="earnBar"><div id="earnProgress" class="earnProgress"></div></div><div id="fullSong2">🎵 Song</div></div></div><div id="completePage"><div class="completeCard"><div style="width:64px;height:64px;border-radius:16px;background:#22c55e;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px">✓</div><div style="font-size:18px;font-weight:900;color:#22c55e;margin-bottom:16px">Video முழுவதும் பார்த்ததற்கு நன்றி</div><div id="earnedAmtDesc">Rs.0.30 Earned!</div><div class="btnRow" style="margin-top:18px"><button class="btnNextNew" onclick="goNextFix()">Next</button><button class="btnCloseNew" onclick="goToHomeFix()">Close</button></div></div></div></div></div>
<div id="settingsBg" onclick="closeSettings()"></div><div id="settings"><div style="height:56px;background:linear-gradient(90deg,#5e17eb,#7c4dff);display:flex;align-items:center;gap:12px;padding:0 16px"><span onclick="closeSettings()" style="font-size:22px;cursor:pointer">‹</span><b>Menu</b></div><div style="padding:14px"><div style="font-size:18px;font-weight:900">Total: ₹ <span id="walletBig">0.00</span></div><div id="uploadDetail">Upload: ₹0</div><div id="watchDetail">Watch: ₹0</div><div style="margin-top:10px">Following: <span id="statFollowing">0</span></div></div></div>
<div id="popup"><div id="popbox"><h3>Song Name?</h3><input id="songName" placeholder="Enter song"><div style="display:flex;gap:10px;margin-top:8px"><button onclick="closePop()" style="flex:1;background:#444;color:#fff;padding:10px;border-radius:10px;border:none">Cancel</button><button onclick="saveVideo()" style="flex:1;background:#5e17eb;color:#fff;padding:10px;border-radius:10px;border:none">Save</button></div></div></div><div id="toast" class="toast"></div>
<script>
let db,tempBlob,tempFileName="",allVideos=[],filteredVideos=[],curIndex=0,curId,curData,earned=false,wallet=0;let watchedIds=new Set(),followedIds=new Set();let curBlobUrl="";let uploadEarnings=0,watchEarnings=0,uploadViews=0,watchViews=0;let currentTab='foryou';
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500);}
let req=indexedDB.open("TAKING_BLOB_V1",3);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("videos"))d.createObjectStore("videos",{keyPath:"id"});};req.onsuccess=e=>{db=e.target.result;loadAll();loadWallet();};
function loadWallet(){let wData=localStorage.getItem('taking_wallet_v2');if(wData){try{let j=JSON.parse(wData);uploadEarnings=j.uploadEarn||0;watchEarnings=j.watchEarn||0;uploadViews=j.uploadViews||0;watchViews=j.watchViews||0;wallet=uploadEarnings+watchEarnings;}catch(e){}}watchedIds=new Set(JSON.parse(localStorage.getItem('taking_watched')||'[]'));followedIds=new Set(JSON.parse(localStorage.getItem('taking_followed')||'[]'));updateWalletUI();}
function saveWallet(){wallet=uploadEarnings+watchEarnings;localStorage.setItem('taking_wallet_v2',JSON.stringify({uploadEarn:uploadEarnings,watchEarn:watchEarnings,uploadViews:uploadViews,watchViews:watchViews}));localStorage.setItem('taking_watched',JSON.stringify([...watchedIds]));}
function saveFollowed(){localStorage.setItem('taking_followed',JSON.stringify([...followedIds]));}
function updateWalletUI(){document.getElementById('wallet').innerText='₹'+wallet.toFixed(2);document.getElementById('walletBig').innerText=wallet.toFixed(2);document.getElementById('statFollowing').innerText=followedIds.size;document.getElementById('followCountTab').innerText=followedIds.size;let plus=document.getElementById('followPlus');if(plus&&curId){if(followedIds.has(curId)){plus.innerText='✓';plus.className='followPlus following';}else{plus.innerText='+';plus.className='followPlus';}}}
function closeSettings(){document.getElementById("settings").style.right="-100%";document.getElementById("settingsBg").style.display="none";}
function closePop(){document.getElementById('popup').style.display='none';}
function pickVideo(){let i=document.createElement('input');i.type='file';i.accept='video/*';i.onchange=e=>{tempBlob=e.target.files[0];tempFileName=tempBlob.name;document.getElementById('songName').value="";document.getElementById('popup').style.display='flex';};i.click();}
function saveVideo(){if(!tempBlob)return;let s=document.getElementById('songName').value.trim()||"Nice";db.transaction("videos","readwrite").objectStore("videos").add({id:Date.now(),name:tempFileName,song:s,blob:tempBlob}).onsuccess=()=>{closePop();loadAll();showToast('Video Added');};}
function switchTab(tab){currentTab=tab;document.getElementById('tabForYou').className=tab=='foryou'?'tabBtn active':'tabBtn';document.getElementById('tabFollowing').className=tab=='following'?'tabBtn active':'tabBtn';loadAll();}
function loadAll(){db.transaction("videos","readonly").objectStore("videos").getAll().onsuccess=e=>{allVideos=e.target.result.sort((a,b)=>b.id-a.id);filteredVideos=currentTab==='following'?allVideos.filter(v=>followedIds.has(v.id)):allVideos;let g=document.getElementById('grid');g.innerHTML="";if(filteredVideos.length===0){g.innerHTML=currentTab==='following'?'<div class="emptyMsg">😕 No Following videos<br>For You la poi Follow pannu!</div>':'<div class="emptyMsg">📹 Video illa<br>+ Video Add pannu</div>';}filteredVideos.forEach(v=>{let u=URL.createObjectURL(v.blob);let d=document.createElement('div');d.className='thumb';d.onclick=()=>openFull(v.id);d.innerHTML='<canvas id="c_'+v.id+'" width="300" height="400"></canvas><div class="label">🎵 '+v.song+'</div>';g.appendChild(d);let c=document.getElementById('c_'+v.id);let x=c.getContext('2d');let vid=document.createElement('video');vid.src=u;vid.muted=true;vid.addEventListener('loadeddata',()=>{vid.currentTime=0.2;});vid.addEventListener('seeked',()=>{try{x.drawImage(vid,0,0,300,400);}catch(e){}});});updateWalletUI();};}
function openFull(id){let idx=filteredVideos.findIndex(x=>x.id===id);showFullAt(idx);}
function showFullAt(idx){if(filteredVideos.length==0)return;if(idx<0)idx=filteredVideos.length-1;if(idx>=filteredVideos.length)idx=0;curIndex=idx;curData=filteredVideos[idx];curId=curData.id;earned=false;document.getElementById('completePage').style.display='none';let fv=document.getElementById('fullVideo');if(curBlobUrl)URL.revokeObjectURL(curBlobUrl);curBlobUrl=URL.createObjectURL(curData.blob);fv.src=curBlobUrl;fv.currentTime=0;document.getElementById('videoPos').innerText=(idx+1)+'/'+filteredVideos.length;document.getElementById('fullSong2').innerText='🎵 '+curData.song;document.getElementById('full').style.display='block';updateWalletUI();fv.oncanplay=()=>fv.play();setupEarnLogic();}
function toggleFollowCur(){if(!curId)return;if(followedIds.has(curId)){followedIds.delete(curId);showToast('Unfollowed');}else{followedIds.add(curId);showToast('Following ✓');}saveFollowed();updateWalletUI();if(currentTab==='following'&&!followedIds.has(curId)){setTimeout(()=>{closeFull();loadAll();},400);}}
function setupEarnLogic(){let fv=document.getElementById('fullVideo');fv.ontimeupdate=()=>{if(!fv.duration)return;document.getElementById('earnProgress').style.width=(fv.currentTime/fv.duration)*100+'%';};fv.onended=()=>{if(earned)return;earned=true;if(!watchedIds.has(curId)){watchViews++;watchEarnings+=0.10;uploadViews++;uploadEarnings+=0.20;watchedIds.add(curId);saveWallet();updateWalletUI();document.getElementById('earnedAmtDesc').innerText='Rs.0.30 Earned! Total ₹'+wallet.toFixed(2);}document.getElementById('completePage').style.display='flex';};}
function goNextFix(){document.getElementById('completePage').style.display='none';setTimeout(()=>showFullAt(curIndex+1),50);}
function goToHomeFix(){document.getElementById('completePage').style.display='none';closeFull();}
function closeFull(){document.getElementById('fullVideo').pause();document.getElementById('full').style.display='none';document.getElementById('completePage').style.display='none';}
function deleteCurVideo(){if(!curId)return;if(!confirm('Delete?'))return;db.transaction("videos","readwrite").objectStore("videos").delete(curId).onsuccess=()=>{showToast('Deleted');closeFull();loadAll();};}
function likeCur(){showToast('Liked ❤️');}function shareAll(){window.open("https://wa.me/?text=TAKING","_blank");}
</script></body></html>
