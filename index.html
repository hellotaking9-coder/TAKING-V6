<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKING V10</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{background:#000;color:#fff;font-family:system-ui}
.post{background:#121212;border:1px solid #222;border-radius:18px;margin-bottom:14px;overflow:hidden}
.scroll-hide::-webkit-scrollbar{display:none}
.active-tab{background:#fff;color:#000!important}
</style>
</head>
<body class="max-w-[520px] mx-auto pb-[80px]">

<!-- HEADER -->
<div class="flex justify-between items-center p-4 sticky top-0 bg-black/90 backdrop-blur z-20 border-b border-zinc-900">
<h1 class="text-[24px] font-black tracking-widest">TAKING <span class="text-purple-500">V10</span></h1>
<button onclick="document.getElementById('createModal').classList.remove('hidden')" class="bg-purple-600 px-4 py-1.5 rounded-full text-sm font-bold"><i class="fa-solid fa-plus mr-1"></i> Post Video</button>
</div>

<!-- FOLLOWING / FOR YOU TABS -->
<div class="flex gap-2 p-3 sticky top-[64px] bg-black z-10">
<button id="tabForYou" onclick="setTab('foryou')" class="flex-1 py-2.5 rounded-full font-bold text-sm border border-zinc-800 active-tab">For You</button>
<button id="tabFollowing" onclick="setTab('following')" class="flex-1 py-2.5 rounded-full font-bold text-sm border border-zinc-800 text-zinc-400">Following <span id="followingCount" class="bg-zinc-800 px-2 py-0.5 rounded-full text-xs ml-1">0</span></button>
</div>

<!-- FEED -->
<div id="feed" class="p-3"></div>

<!-- CREATE POST MODAL -->
<div id="createModal" class="hidden fixed inset-0 bg-black/90 z-50 p-4 flex items-center justify-center">
<div class="bg-zinc-900 w-full max-w-[440px] rounded-[22px] p-5">
<div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">Video / Photo Post போடு தலைவா</h2><button onclick="this.closest('#createModal').classList.add('hidden')" class="w-8 h-8 bg-black rounded-full">✕</button></div>
<input id="postUser" placeholder="உன் பேர் (ex: thala_ajith)" class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-sm mb-3 outline-none">
<input id="postCaption" placeholder="Caption எழுது..." class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-sm mb-3 outline-none">
<input id="postMedia" placeholder="Video/Image Link Paste பண்ணு (picsum.photos / mp4 link)" class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-sm mb-3 outline-none">
<p class="text-xs text-zinc-500 mb-3">Video வேணும்னா: https://www.w3schools.com/html/mov_bbb.mp4 மாதிரி link போடு</p>
<button onclick="createPost()" class="w-full bg-white text-black py-3 rounded-full font-black">POST NOW</button>
</div>
</div>

<!-- FOLLOWERS MODAL -->
<div id="followModal" class="hidden fixed inset-0 bg-black/90 z-50 p-3">
<div class="bg-zinc-900 rounded-[20px] p-4 max-w-[520px] mx-auto mt-10">
<div class="flex justify-between items-center mb-4"><h2 class="font-bold">Following / Followers</h2><button onclick="document.getElementById('followModal').classList.add('hidden')" class="w-8 h-8 bg-black rounded-full">✕</button></div>
<div id="followList"></div>
</div>
</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 w-full max-w-[520px] bg-black border-t border-zinc-900 flex justify-around py-3 text-xl z-20">
<i class="fa-solid fa-house"></i>
<i onclick="document.getElementById('followModal').classList.remove('hidden');renderFollows()" class="fa-solid fa-users text-zinc-500 cursor-pointer"></i>
<i onclick="document.getElementById('createModal').classList.remove('hidden')" class="fa-regular fa-square-plus text-zinc-500 cursor-pointer"></i>
<img src="https://i.pravatar.cc/100?img=1" class="w-6 h-6 rounded-full">
</div>

<script>
let allPosts = JSON.parse(localStorage.getItem('taking_posts') || 'null') || [
{user:'arjun_official', avatar:'https://i.pravatar.cc/100?img=11', type:'video', media:'https://www.w3schools.com/html/mov_bbb.mp4', likes:512, caption:'என் புது Bike Video 🏍️ - Following பண்ணா தான் உனக்கு தெரியும்!'},
{user:'priya_s', avatar:'https://i.pravatar.cc/100?img=32', type:'image', media:'https://picsum.photos/seed/taking11/600/800', likes:890, caption:'New Dance Video soon 💜'},
{user:'kavin_editz', avatar:'https://i.pravatar.cc/100?img=15', type:'video', media:'https://www.w3schools.com/html/movie.mp4', likes:1203, caption:'Jeddah Beach Vlog 🔥'},
{user:'thala_fan', avatar:'https://i.pravatar.cc/100?img=8', type:'image', media:'https://picsum.photos/seed/taking12/600/700', likes:234, caption:'TAKING V10 Full Working!'}
];
let following = JSON.parse(localStorage.getItem('taking_following') || '[]');
let currentTab = 'foryou';

function setTab(tab){
currentTab=tab;
document.getElementById('tabForYou').className = tab==='foryou'? 'flex-1 py-2.5 rounded-full font-bold text-sm border border-zinc-800 active-tab' : 'flex-1 py-2.5 rounded-full font-bold text-sm border border-zinc-800 text-zinc-400';
document.getElementById('tabFollowing').className = tab==='following'? 'flex-1 py-2.5 rounded-full font-bold text-sm border border-zinc-800 active-tab' : 'flex-1 py-2.5 rounded-full font-bold text-sm border border-zinc-800 text-zinc-400';
renderFeed();
}

function renderFeed(){
let postsToShow = currentTab==='following'? allPosts.filter(p=> following.includes(p.user)) : allPosts;
if(postsToShow.length===0 && currentTab==='following'){
document.getElementById('feed').innerHTML = `<div class='text-center py-20 text-zinc-500'><i class='fa-solid fa-users-slash text-4xl mb-3'></i><p class='font-bold'>யாரையும் Follow பண்ணல தலைவா</p><p class='text-xs mt-1'>For You-ல போய் Follow பண்ணு, அப்ப தான் அவங்க Video இங்க தெரியும்</p></div>`;
return;
}
document.getElementById('feed').innerHTML = postsToShow.map((p,idx)=>`
<div class="post">
<div class="flex items-center gap-3 p-3">
<img src="${p.avatar}" class="w-9 h-9 rounded-full"><div class="flex-1"><p class="font-bold text-[14px]">${p.user}</p><p class="text-[11px] text-zinc-500">${p.type==='video'?'Video Post':'Photo Post'} • now</p></div>
<button onclick="toggleFollow('${p.user}')" class="${following.includes(p.user)?'bg-zinc-800 text-white':'bg-white text-black'} px-4 py-1.5 rounded-full text-[13px] font-bold">${following.includes(p.user)?'Following':'Follow'}</button>
</div>
${p.type==='video'? `<video src="${p.media}" controls autoplay muted loop playsinline class="w-full max-h-[600px] bg-black"></video>` : `<img src="${p.media}" class="w-full">`}
<div class="p-3">
<div class="flex gap-4 text-[21px] mb-2"><i class="fa-regular fa-heart"></i><i class="fa-regular fa-comment"></i><i class="fa-regular fa-paper-plane"></i><i class="fa-regular fa-bookmark ml-auto"></i></div>
<p class="font-bold text-[13px]">${p.likes} likes</p>
<p class="text-[14px] mt-1"><span class="font-bold">${p.user}</span> ${p.caption}</p>
</div>
</div>`).join('');
document.getElementById('followingCount').innerText = following.length;
}

function toggleFollow(name){
if(following.includes(name)){ following = following.filter(n=>n!==name); }
else{ following.push(name); }
localStorage.setItem('taking_following', JSON.stringify(following));
renderFeed();
}

function createPost(){
let user = document.getElementById('postUser').value || 'you_'+Math.floor(Math.random()*100);
let cap = document.getElementById('postCaption').value || 'My new video 🔥';
let media = document.getElementById('postMedia').value || 'https://picsum.photos/seed/'+Date.now()+'/600/700';
let isVideo = media.includes('.mp4') || media.includes('.mov') || media.includes('video');
let newPost = {user, avatar:`https://i.pravatar.cc/100?img=${Math.floor(Math.random()*60)}`, type:isVideo?'video':'image', media, likes:0, caption:cap};
allPosts.unshift(newPost);
localStorage.setItem('taking_posts', JSON.stringify(allPosts));
document.getElementById('createModal').classList.add('hidden');
renderFeed();
setTab('foryou');
alert('Post போட்டாச்சு தலைவா! உன்ன Follow பண்றவங்களுக்கு Following Tab-ல தெரியும்!');
}

function renderFollows(){
let list = document.getElementById('followList');
if(following.length===0){ list.innerHTML = `<p class='text-zinc-500 text-center py-10 text-sm'>இன்னும் யாரையும் Follow பண்ணல</p>`; return; }
list.innerHTML = following.map(n=>`<div class='flex items-center gap-3 bg-black p-3 rounded-xl border border-zinc-800 mb-2'><img src='https://i.pravatar.cc/100' class='w-10 h-10 rounded-full'><div class='flex-1'><p class='font-bold text-sm'>${n}</p><p class='text-xs text-zinc-500'>Following • அவன் Video உனக்கு தெரியும்</p></div><button onclick="toggleFollow('${n}');renderFollows()" class='bg-zinc-800 px-4 py-1 rounded-full text-sm'>Unfollow</button></div>`).join('');
}

renderFeed();
</script>
</body>
</html>
