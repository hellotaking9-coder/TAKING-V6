<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKING V6 TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;overflow:hidden;height:100vh}
#app{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.video-container{height:100vh;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
video{height:100%;width:100%;object-fit:cover}
.overlay{position:absolute;bottom:70px;left:0;right:0;padding:15px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;justify-content:space-between}
.right{display:flex;flex-direction:column;gap:18px}
.icon-btn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:24px;flex-direction:column}
.header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:30px;padding:15px;font-weight:bold;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:12px 0;background:#000;border-top:1px solid #222}
</style>
</head>
<body>
<div class="header"><span style="border-bottom:2px solid #fff">For You</span><span>Following</span></div>
<div id="app">
<div class="video-container">
<video loop autoplay muted playsinline src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
<div class="overlay"><div><h3>@taking_v6 🔥</h3><p>Swipe Up! #taking #viral</p></div><div class="right"><div class="icon-btn">❤️</div><div class="icon-btn">💬</div><div class="icon-btn">↗️</div></div></div>
</div>
<div class="video-container">
<video loop playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
<div class="overlay"><div><h3>@friend_tamil 😎</h3><p>Taking V6 Semma!</p></div><div class="right"><div class="icon-btn">❤️</div><div class="icon-btn">💬</div><div class="icon-btn">↗️</div></div></div>
</div>
</div>
<div class="bottom-nav"><div>🏠Home</div><div>🔍Discover</div><div>+</div><div>💬Inbox</div><div>👤Profile</div></div>
<script>
const obs=new IntersectionObserver(es=>{es.forEach(e=>{const v=e.target.querySelector('video');if(e.isIntersecting)v.play();else v.pause();})},{threshold:0.7});
document.querySelectorAll('.video-container').forEach(c=>obs.observe(c));
</script>
</body>
</html>
